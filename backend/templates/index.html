<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Information Form</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <h1>Patient Information</h1>
        <form id="patientForm">
            <div class="form-group">
                <label for="patientId">Patient ID</label>
                <input type="text" id="patientId" name="patientId" required>
            </div>

            <div class="form-group">
                <label for="patientName">Patient Name</label>
                <input type="text" id="patientName" name="patientName" pattern="[A-Za-z\s]+" title="Patient name should only contain letters and spaces" required>
            </div>

            <div class="form-group">
                <label for="patientPhone">Phone Number</label>
                <input type="tel" id="patientPhone" name="patientPhone" pattern="[0-9]+" title="Phone number should only contain digits" required>
            </div>

            <div class="form-group">
                <label for="patientEmail">Email</label>
                <input type="email" id="patientEmail" name="patientEmail" required>
            </div>

            <div class="form-group">
                <label for="patientAddress">Address</label>
                <textarea id="patientAddress" name="patientAddress" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                patientId: document.getElementById('patientId').value,
                patientName: document.getElementById('patientName').value,
                patientPhone: document.getElementById('patientPhone').value,
                patientEmail: document.getElementById('patientEmail').value,
                patientAddress: document.getElementById('patientAddress').value
            };

            console.log('Sending Patient Information:', formData);

            try {
                // Replace the URL with an actual API endpoint
                const response = await fetch('https://api.example.com/patients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                console.log('Response from server:', result);
                
                alert('Patient information submitted successfully!');
                
                this.reset();
            } catch (error) {
                console.error('Error submitting form:', error);
                alert('Error submitting patient information. Please try again.');
            }
        });
    </script>
</body>
</html>
